<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pencatat Keuangan | Tambah Transaksi</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Pencatat Keuangan</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Transaksi</a></li>
                <li><a href="tambah.html">Tambah Transaksi</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Transaksi</h2>
            <form id="form-tambah">
                <p>
                    <label for="keterangan">Keterangan</label><br>
                    <input type="text" id="keterangan" name="keterangan" required>
                </p>
                <p>
                    <label for="jenis">Jenis</label><br>
                    <select id="jenis" name="jenis" required>
                        <option value="pemasukan">Pemasukan</option>
                        <option value="pengeluaran">Pengeluaran</option>
                    </select>
                </p>
                <p>
                    <label for="jumlah">Jumlah Rp. </label><br>
                    <input type="number" id="jumlah" name="jumlah" min="0" required>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>
</html>
