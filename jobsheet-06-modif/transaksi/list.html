<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pencatat Keuangan | Daftar Transaksi</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Pencatat Keuangan</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Transaksi</a></li>
                <li><a href="tambah.html">Tambah Transaksi</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Transaksi</h2>
            <div class="search-box">
                <label for="search-input">Cari Transaksi</label>
                <input type="text" id="search-input" placeholder="Ketik judul buku...">
            </div>
            <p id="loading-indicator" style="display:none;">Memuat data...</p>
            <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Keterangan</th>
                        <th>Jenis</th>
                        <th>Jumlah</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Baris diisi dinamis oleh assets/js/transaksi.js via fetch('../data/transaksi.json') -->
                </tbody>
            </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pencatat Keuangan &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/transaksi.js"></script>
</body>
</html>
